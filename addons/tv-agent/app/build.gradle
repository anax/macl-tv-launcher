plugins {
    id 'com.android.application'
}

android {
    namespace 'com.macl.tvagent'
    compileSdk 34

    defaultConfig {
        applicationId 'com.macl.tvagent'
        // The TV in this repo is Android 11 (SDK 30); 26 keeps the same floor as the launcher.
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB like the launcher: signed with the debug key. Sign your own releases with your key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Test only (never in the APK): the agent loop and the HTTP page logic run as plain JVM tests.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
